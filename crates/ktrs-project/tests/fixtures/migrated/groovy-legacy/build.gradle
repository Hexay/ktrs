buildscript {
    ext {
        composeRules = "0.0.26"
    }
    repositories { mavenCentral() }
    dependencies { classpath("io.github.hexay:ktrs:0.5.0") }
}

apply plugin: "io.github.hexay.ktrs.ktlint"
apply plugin: 'com.diffplug.spotless'

/* block comment { */
ktlint {
    version = ktlintVersion
    android = true
    additionalEditorconfig = ["ktlint_code_style": "android_studio", max_line_length: '100']
}

dependencies {
    ktlintRuleset "com.twitter.compose.rules:ktlint:${composeRules}"
}

spotless {
    kotlin {
        if (System.getenv("CI")) {
            println 'ci'
        }
        addStep(io.github.hexay.ktrs.spotless.KtrsStep.create(io.github.hexay.ktrs.KtrsOptions.kotlinlang().withMaxWidth(110)))
    }
}
