[package]
name = "kt-syntax"
description = "A parser for Kotlin: lossless syntax trees identical to the Kotlin compiler's PSI, with navigation, positions, syntax errors and text edits"
readme = "README.md"
keywords = ["kotlin", "parser", "syntax-tree", "psi", "codemod"]
categories = ["parser-implementations", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
ktrs-syntax.workspace = true
ktrs-lexer.workspace = true
ktrs-parser.workspace = true
stacker = "0.1"

# The examples carry their own tests, so `cargo test` keeps them working.
[[example]]
name = "missing_kdoc"
test = true

[[example]]
name = "rename_call"
test = true
