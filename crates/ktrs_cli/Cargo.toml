[package]
name = "ktrs_cli"
description = "Command-line front ends: `ktrs` and a flag-compatible `ktfmt`"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ktrs"
path = "src/bin/ktrs.rs"

[[bin]]
name = "ktfmt"
path = "src/bin/ktfmt.rs"

[dependencies]
ktrs_fmt.workspace = true
ec4rs = "1"
mimalloc.workspace = true
