# On a `v*` tag: build `ktrs` + `ktfmt` for six targets and publish them as a GitHub release,
# one archive per target plus SHA256SUMS; then the JVM jar and the Homebrew formula.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The pre-commit launcher downloads the release tagged v<its version>, so the versions must agree.
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml and pyproject.toml
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -qx "version = \"$v\"" Cargo.toml || { echo "Cargo.toml's version is not $v"; exit 1; }
          grep -qx "version = \"$v\"" pyproject.toml || { echo "pyproject.toml's version is not $v"; exit 1; }

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          # Cross-compiled on Apple silicon: the Intel macOS runner images are retired.
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: cargo build --locked --profile dist --target ${{ matrix.target }} --bins
      - name: Package
        shell: bash
        run: |
          name="ktrs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/dist/ktrs$ext" "target/${{ matrix.target }}/dist/ktfmt$ext" "$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE "$name/"
          if [[ -n "$ext" ]]; then 7z a -bd "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          # Not `ktrs-*.*`: the staging directory's name has dots too (v0.1.0).
          path: |
            ktrs-*.tar.gz
            ktrs-*.zip

  # The JVM wrapper (io.github.hexay:ktrs) with all six binaries bundled, published to the GitHub
  # Pages Maven repo, and to Maven Central only when the MAVEN_CENTRAL_* and SIGNING_* secrets exist.
  java:
    needs: build
    runs-on: ubuntu-24.04
    # Shares the gh-pages branch with the playground (pages.yml).
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Bundle the binaries
        shell: bash
        run: |
          for pair in x86_64-unknown-linux-musl:linux-x86_64 aarch64-unknown-linux-musl:linux-aarch64 \
                      x86_64-apple-darwin:macos-x86_64 aarch64-apple-darwin:macos-aarch64 \
                      x86_64-pc-windows-msvc:windows-x86_64 aarch64-pc-windows-msvc:windows-aarch64; do
            target=${pair%%:*} dir=java/native/${pair##*:}
            mkdir -p "$dir"
            case $target in
              *windows*) unzip -j -q dist/ktrs-*-$target.zip '*/ktrs.exe' -d "$dir" ;;
              *) tar -xzf dist/ktrs-*-$target.tar.gz -C "$dir" --strip-components=1 --wildcards '*/ktrs' ;;
            esac
          done
          find java/native -type f
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: Test and build
        working-directory: java
        run: ./gradlew --console=plain test jar -PktrsVersion=${GITHUB_REF_NAME#v} -PktrsExecutable=native/linux-x86_64/ktrs
      # Served at https://hexay.github.io/ktrs/maven once Pages serves the gh-pages branch.
      - name: Publish to the GitHub Pages Maven repo
        shell: bash
        run: |
          if git fetch -q origin gh-pages:gh-pages; then git worktree add pages gh-pages; else git worktree add --orphan -b gh-pages pages; fi
          (cd java && ./gradlew --console=plain publishAllPublicationsToGithubPagesRepository \
            -PktrsVersion=${GITHUB_REF_NAME#v} -PpagesRepo="$GITHUB_WORKSPACE/pages/maven")
          cd pages
          touch .nojekyll
          git add -A
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "maven: io.github.hexay:ktrs:${GITHUB_REF_NAME#v}"
          git push -q origin gh-pages
      - name: Publish to Maven Central
        if: env.ORG_GRADLE_PROJECT_mavenCentralUsername != ''
        working-directory: java
        run: ./gradlew --console=plain publishAndReleaseToMavenCentral -PktrsVersion=${GITHUB_REF_NAME#v}
      - uses: actions/upload-artifact@v4
        with:
          name: java
          path: java/build/libs/ktrs-*[0-9].jar

  release:
    needs: [build, java]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum ktrs-*.tar.gz ktrs-*.zip ktrs-*.jar > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes ktrs-*.tar.gz ktrs-*.zip ktrs-*.jar SHA256SUMS

  # Formula/ktrs.rb for `brew tap hexay/ktrs https://github.com/Hexay/ktrs`: generated from the
  # release's checksums, installed and tested from a scratch tap, then committed to master.
  homebrew:
    needs: release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - name: Generate and test the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          mkdir -p Formula
          bash tools/release/homebrew-formula.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/SHA256SUMS" > Formula/ktrs.rb
          brew tap-new --no-git ktrs-ci/scratch
          cp Formula/ktrs.rb "$(brew --repository ktrs-ci/scratch)/Formula/"
          brew install ktrs-ci/scratch/ktrs
          brew test ktrs-ci/scratch/ktrs
      - name: Commit it
        run: |
          git add Formula/ktrs.rb
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -q -m "Homebrew formula for $GITHUB_REF_NAME"
          git push -q origin HEAD:master
