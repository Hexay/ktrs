# On a `v*` tag: build `ktrs` + `ktfmt` + `ktlint` for six targets and publish them as a GitHub release,
# one archive per target plus SHA256SUMS and a rules_multitool lockfile; then the JVM jar, the VS Code extension, the
# IntelliJ plugin and the Homebrew formula.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The corpus, CLI and build-tool parity gates run nightly, not per push: the tagged commit must have passed them.
  parity:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: parity.yml succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          runs=$(gh run list --workflow parity.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [[ $runs == 0 ]]; then
            echo "::error::no successful parity.yml run for $GITHUB_SHA"
            echo "Run it on this commit, wait for it to pass, then re-run this workflow:"
            echo "  gh workflow run parity.yml --ref $GITHUB_REF_NAME"
            exit 1
          fi

  # The pre-commit launcher downloads the release tagged v<its version>, so the versions must agree.
  versions:
    needs: parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml, pyproject.toml and the VS Code extension
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -qx "version = \"$v\"" Cargo.toml || { echo "Cargo.toml's version is not $v"; exit 1; }
          grep -qx "version = \"$v\"" pyproject.toml || { echo "pyproject.toml's version is not $v"; exit 1; }
          [[ $(jq -r .version editors/vscode/package.json) == "$v" ]] || { echo "editors/vscode/package.json's version is not $v"; exit 1; }

  build:
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          # Cross-compiled on Apple silicon: the Intel macOS runner images are retired.
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: cargo build --locked --profile dist --target ${{ matrix.target }} --bins
      - name: Package
        shell: bash
        run: |
          name="ktrs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/dist/ktrs$ext" "target/${{ matrix.target }}/dist/ktfmt$ext" \
            "target/${{ matrix.target }}/dist/ktlint$ext" "$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE "$name/"
          if [[ -n "$ext" ]]; then 7z a -bd "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          # Not `ktrs-*.*`: the staging directory's name has dots too (v0.1.0).
          path: |
            ktrs-*.tar.gz
            ktrs-*.zip

  # The JVM wrapper (io.github.hexay:ktrs) with all six binaries bundled, the Gradle plugin artifact (ids
  # io.github.hexay.ktrs, .ktrs.ktlint and .ktrs.kotlinter, each with its marker) and the Maven plugin (io.github.hexay:ktrs-ktlint-maven-plugin), published to the
  # GitHub Pages Maven repo; the jar and the Maven plugin to Maven Central only when
  # the MAVEN_CENTRAL_* and SIGNING_* secrets exist, the plugin to the Plugin Portal only when the
  # GRADLE_PUBLISH_* ones do.
  java:
    needs: build
    runs-on: ubuntu-24.04
    # Shares the gh-pages branch with the playground (pages.yml).
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Bundle the binaries
        run: bash tools/release/bundle-natives.sh dist java/native
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: Test and build
        working-directory: java
        run: ./gradlew --console=plain test jar -PktrsVersion=${GITHUB_REF_NAME#v} -PktrsExecutable=native/linux-x86_64/ktrs
      # Served at https://hexay.github.io/ktrs/maven once Pages serves the gh-pages branch.
      - name: Publish to the GitHub Pages Maven repo
        shell: bash
        run: |
          if git fetch -q origin gh-pages:gh-pages; then git worktree add pages gh-pages; else git worktree add --orphan -b gh-pages pages; fi
          (cd java && ./gradlew --console=plain :publishAllPublicationsToGithubPagesRepository \
            -PktrsVersion=${GITHUB_REF_NAME#v} -PpagesRepo="$GITHUB_WORKSPACE/pages/maven" \
            && ./gradlew --console=plain :ktrs-gradle-plugin:publishAllPublicationsToGithubPagesRepository \
            :ktrs-ktlint-maven-plugin:publishAllPublicationsToGithubPagesRepository \
            -PktrsVersion=${GITHUB_REF_NAME#v} -PpagesRepo="$GITHUB_WORKSPACE/pages/maven")
          cd pages
          touch .nojekyll
          git add -A
          # config, not -c on the commit: the rebase below also needs a committer once another job has pushed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "maven: io.github.hexay:ktrs, the Gradle and Maven plugins ${GITHUB_REF_NAME#v}"
          git push -q origin gh-pages
      # The Maven plugin depends on io.github.hexay:ktrs, so the jar goes first.
      - name: Publish to Maven Central
        if: env.ORG_GRADLE_PROJECT_mavenCentralUsername != ''
        working-directory: java
        run: |
          ./gradlew --console=plain :publishAndReleaseToMavenCentral -PktrsVersion=${GITHUB_REF_NAME#v}
          ./gradlew --console=plain :ktrs-ktlint-maven-plugin:publishAndReleaseToMavenCentral -PktrsVersion=${GITHUB_REF_NAME#v}
      # The Portal resolves the plugin's io.github.hexay:ktrs dependency from Maven Central.
      - name: Publish the Gradle plugin to the Plugin Portal
        if: env.GRADLE_PUBLISH_KEY != ''
        working-directory: java
        run: |
          ./gradlew --console=plain :ktrs-gradle-plugin:publishPlugins -PktrsVersion=${GITHUB_REF_NAME#v} \
            -Pgradle.publish.key="$GRADLE_PUBLISH_KEY" -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET"
      - uses: actions/upload-artifact@v4
        with:
          name: java
          path: java/build/libs/ktrs-*[0-9].jar

  # The VS Code extension (hexay.ktrs): one VSIX per VS Code target with its binary, plus a universal one that runs
  # `ktrs` from PATH; to the Marketplace (targets only) when VSCE_PAT exists, to Open VSX (all) when OVSX_PAT does.
  vscode:
    needs: build
    runs-on: ubuntu-24.04
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: editors/vscode/package-lock.json }
      - run: npm ci
        working-directory: editors/vscode
      - name: Package
        run: bash tools/release/package-vscode.sh dist vsix
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: editors/vscode
        run: npx vsce publish --skip-duplicate --packagePath $(ls ../../vsix/*.vsix | grep -v universal)
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: editors/vscode
        run: npx ovsx publish --skip-duplicate --packagePath ../../vsix/*.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: vsix/*.vsix

  # The IntelliJ IDEA / Android Studio plugin (io.github.hexay.ktrs) with all six binaries bundled, attached to the
  # release as ktrs-intellij-<version>.zip; to the JetBrains Marketplace when JETBRAINS_MARKETPLACE_TOKEN exists.
  # The Marketplace takes a new plugin's first version only by hand (https://plugins.jetbrains.com/plugin/add):
  # upload that zip there once, then this job publishes every later version.
  intellij:
    needs: build
    runs-on: ubuntu-24.04
    env:
      JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Bundle the binaries
        working-directory: .
        run: bash tools/release/bundle-natives.sh dist editors/intellij/bin
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the plugin
        run: ./gradlew --console=plain buildPlugin -PktrsVersion=${GITHUB_REF_NAME#v}
      - uses: actions/upload-artifact@v4
        with:
          name: intellij
          path: editors/intellij/build/distributions/ktrs-intellij-*.zip
          if-no-files-found: error
      - name: Publish to the JetBrains Marketplace
        if: env.JETBRAINS_MARKETPLACE_TOKEN != ''
        run: ./gradlew --console=plain publishPlugin -PktrsVersion=${GITHUB_REF_NAME#v}

  # ghcr.io/hexay/ktrs:<version> and :latest for linux/amd64 + arm64, from the static musl binaries (docker/Dockerfile).
  docker:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*-linux-musl"
          merge-multiple: true
      - name: Build context and image version
        id: context
        run: |
          bash tools/release/docker-context.sh dist docker-context
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        # Its default build-record artifact (*.dockerbuild) breaks the release job's download of all artifacts.
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: docker-context
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.context.outputs.version }}
          # On the index too: ghcr reads a multi-arch image's description and repository link from there.
          annotations: |
            index:org.opencontainers.image.source=https://github.com/Hexay/ktrs
            index:org.opencontainers.image.description=Fast Kotlin formatter and linter: drop-in ktfmt and ktlint binaries
            index:org.opencontainers.image.licenses=MIT OR Apache-2.0
          tags: |
            ghcr.io/hexay/ktrs:${{ steps.context.outputs.version }}
            ghcr.io/hexay/ktrs:latest
          push: true

  # @ktrs/cli and its six @ktrs/cli-<os>-<cpu> binary packages, to npm only when NPM_TOKEN exists.
  npm:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - name: Package
        run: node tools/release/package-npm.mjs dist npm-out "$GITHUB_REF_NAME"
      # @ktrs/cli's optional dependencies must exist before it does; a re-run skips what's already published.
      # Gated on NPM_TOKEN, not NODE_AUTH_TOKEN: setup-node sets the latter to a placeholder when it's empty.
      - name: Publish
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm-out/cli-* npm-out/cli; do
            name=$(jq -r .name "$dir/package.json") version=$(jq -r .version "$dir/package.json")
            if npm view "$name@$version" version > /dev/null 2>&1; then echo "$name@$version exists"; continue; fi
            # ./ or npm reads npm-out/cli-x as a GitHub owner/repo.
            npm publish --provenance --access public "./$dir"
          done

  release:
    needs: [build, java, vscode, intellij]
    runs-on: ubuntu-24.04
    steps:
      # Into a subdirectory: the artifacts land in the workspace root.
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: tools/release
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # ktrs-*.zip includes the IntelliJ plugin (ktrs-intellij-<version>.zip).
      - name: Checksums
        run: sha256sum ktrs-*.tar.gz ktrs-*.zip ktrs-*.jar ktrs-*.vsix > SHA256SUMS
      # For Bazel's rules_multitool. Generated from SHA256SUMS, so it is not listed there.
      - name: rules_multitool lockfile
        run: bash src/tools/release/multitool-lock.sh "$GITHUB_REF_NAME" SHA256SUMS > "ktrs-$GITHUB_REF_NAME.multitool.lock.json"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            ktrs-*.tar.gz ktrs-*.zip ktrs-*.jar ktrs-*.vsix SHA256SUMS "ktrs-$GITHUB_REF_NAME.multitool.lock.json"

  # The rules_lint recipes of the README's Bazel section against the published lockfile: real downloads and checksums.
  bazel:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: bazel/e2e/rules_lint/MODULE.bazel
      - name: Format and lint the e2e workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p "ktrs-$GITHUB_REF_NAME.multitool.lock.json" -D "$RUNNER_TEMP"
          bash bazel/e2e/rules_lint/test.sh "$RUNNER_TEMP/ktrs-$GITHUB_REF_NAME.multitool.lock.json"

  # Formula/ktrs.rb for `brew tap hexay/ktrs https://github.com/Hexay/ktrs`: generated from the
  # release's checksums, installed and tested from a scratch tap, then committed to master.
  homebrew:
    needs: release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - name: Generate and test the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          mkdir -p Formula
          bash tools/release/homebrew-formula.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/SHA256SUMS" > Formula/ktrs.rb
          brew tap-new --no-git ktrs-ci/scratch
          cp Formula/ktrs.rb "$(brew --repository ktrs-ci/scratch)/Formula/"
          brew install ktrs-ci/scratch/ktrs
          brew test ktrs-ci/scratch/ktrs
      - name: Commit it
        run: |
          git add Formula/ktrs.rb
          # config, not -c on the commit: the rebase below also needs a committer once another job has pushed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "Homebrew formula for $GITHUB_REF_NAME"
          git pull -q --rebase origin master
          git push -q origin HEAD:master

  # bucket/ktrs.json for `scoop bucket add ktrs https://github.com/Hexay/ktrs`: generated from the release's
  # checksums, installed and run with Scoop, then committed to master.
  scoop:
    needs: release
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - name: Generate the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          mkdir -p bucket
          bash tools/release/scoop-manifest.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/SHA256SUMS" > bucket/ktrs.json
      - name: Install and run it
        shell: pwsh
        run: |
          Invoke-RestMethod get.scoop.sh -OutFile install-scoop.ps1
          .\install-scoop.ps1 -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop install .\bucket\ktrs.json  # bucket/ktrs.json would mean app ktrs.json in a bucket named "bucket"
          if (("fun  f( ) = 1" | ktfmt -) -ne 'fun f() = 1') { exit 1 }
          ktlint --version; if ($LASTEXITCODE) { exit 1 }
      - name: Commit it
        run: |
          git add bucket/ktrs.json
          # config, not -c on the commit: the rebase below also needs a committer once another job has pushed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "Scoop manifest for $GITHUB_REF_NAME"
          git pull -q --rebase origin master
          git push -q origin HEAD:master

  # Hexay.ktrs on winget: a pull request to microsoft/winget-pkgs, only when the WINGET_TOKEN secret (a classic
  # token with public_repo, for the fork) exists. The manifests are uploaded either way.
  winget:
    needs: release
    runs-on: windows-2022
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Generate the manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          bash tools/release/winget-manifests.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/SHA256SUMS" winget
      - uses: actions/upload-artifact@v4
        with:
          name: winget
          path: winget
      - name: Submit to winget-pkgs
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "New version: Hexay.ktrs $($env:GITHUB_REF_NAME.TrimStart('v'))" winget
