# The self-contained gates: parser fixtures, PSI accessor hashes, ktfmt goldens, CLI tests, the JVM
# wrapper, the Wasm build, the VS Code extension. Corpus diffs need the JVM oracles and run outside CI (see CLAUDE.md).
name: ci

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # The `ci` profile: release optimizations without fat LTO (see Cargo.toml).
      - run: cargo test --locked --profile ci --workspace

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p ktrs-wasm --target wasm32-unknown-unknown

  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --bins
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: Test the JVM wrapper and the Gradle plugin against target/debug/ktrs
        working-directory: java
        run: ./gradlew --console=plain test

  vscode:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --bins
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: editors/vscode/package-lock.json }
      - name: Test the extension against target/debug/ktrs
        working-directory: editors/vscode
        run: |
          npm ci
          npm run check
          xvfb-run -a npm test
