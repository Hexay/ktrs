name: upstream

# Weekly: opens an issue when ktfmt, ktlint, compose-rules or Kotlin publishes a release newer than the pin in tools/sync-*.sh.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare pins with the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pin() { sed -n "s/^$1=//p" "tools/$2"; }
          check() { # name repo pinned latest
            local title="Upstream: $1 $4 released (pinned $3)"
            if [[ $3 == "$4" ]]; then echo "$1: $3 is current"; return; fi
            if gh issue list --state all --search "in:title \"$title\"" --json number --jq length | grep -qx 0; then
              gh issue create --title "$title" --body "https://github.com/$2/releases/tag/$4 — pinned \`$3\` in \`tools/\`. Bump the pin, rerun the parity gates (CLAUDE.md), then cut a release."
            fi
            echo "$1: $4 available (pinned $3)"
          }
          check ktfmt facebook/ktfmt "$(pin KTFMT_TAG sync-ktfmt.sh)" "$(gh api repos/facebook/ktfmt/releases/latest --jq .tag_name)"
          # ktlint: the newest release on any line, prereleases included (the pin is a 2.0 alpha; 1.x still ships).
          check ktlint pinterest/ktlint "$(pin KTLINT_TAG sync-ktlint.sh)" "$(gh api 'repos/pinterest/ktlint/releases?per_page=1' --jq '.[0].tag_name')"
          check compose-rules mrmans0n/compose-rules "$(pin COMPOSE_RULES_TAG sync-compose-rules.sh)" "$(gh api repos/mrmans0n/compose-rules/releases/latest --jq .tag_name)"
          check kotlin JetBrains/kotlin "$(pin KOTLIN_TAG sync-kotlin.sh)" "$(gh api repos/JetBrains/kotlin/releases/latest --jq .tag_name)"
