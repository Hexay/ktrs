name: parity-setup
description: "The shared setup of parity.yml's gate jobs: JDK 21, corpus/ from the `corpus` job's cache, Rust and its cache."
inputs:
  tree:
    description: Also copy the corpus's .kt/.kts files to $RUNNER_TEMP/corpus (no .git, no project .editorconfig; not under target/, whose files rust-cache prunes; keep the name `corpus`, known-diffs rows start with it)
    default: "false"
runs:
  using: composite
  steps:
    # Every tools/ download (jars, Maven, JDK) retries: Maven Central returns transient HTTP errors for minutes at a time.
    - shell: bash
      run: printf 'retry = 8\nretry-all-errors\nshow-error\n' > ~/.curlrc
    - uses: actions/setup-java@v4
      with: { distribution: temurin, java-version: 21 }
    - uses: actions/cache/restore@v4
      with:
        path: corpus
        key: corpus-${{ hashFiles('tools/corpus/REVISIONS') }}
        fail-on-cache-miss: true
    - uses: actions/cache/restore@v4
      with:
        path: |
          tools/ktlint-oracle/lib
          tools/ktfmt-oracle/lib
          tools/compose-rules/lib
        key: jars-${{ hashFiles('tools/sync-ktlint.sh', 'tools/sync-ktfmt.sh', 'tools/sync-compose-rules.sh') }}-${{ env.KTLINT_18_URL }}
        fail-on-cache-miss: true
    - if: inputs.tree == 'true'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/corpus"
        (cd corpus && find . -name .git -prune -o -type f \( -name '*.kt' -o -name '*.kts' \) -print | tar -cf - -T -) |
          tar -xf - -C "$RUNNER_TEMP/corpus"
    - name: Install Rust
      shell: bash
      run: rustup toolchain install stable --profile minimal && rustup default stable
    # One cache per job: each builds a different set of binaries.
    - uses: Swatinem/rust-cache@v2
      with: { shared-key: "parity-${{ github.job }}", cache-on-failure: true }
