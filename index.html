<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ktrs playground</title>
<meta name="description" content="Format Kotlin in your browser, byte-identical to ktfmt 0.65. The ktrs formatter compiled to WebAssembly.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e3e3e0;
    --accent: #7c3aed; --accent-soft: #ede9fe; --error: #b42318; --ok: #067647;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --panel: #18181b; --text: #ececef; --muted: #9b9ba3; --line: #2c2c31;
      --accent: #a78bfa; --accent-soft: #2e2542; --error: #f97066; --ok: #47cd89;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  header { padding: 20px 24px 12px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
  h1 { margin: 0; font-size: 20px; font-weight: 650; }
  header p { margin: 0; color: var(--muted); }
  header a { color: var(--accent); }
  .controls { padding: 0 24px 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  select, input, button {
    font: inherit; font-size: 14px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  input[type=number] { width: 80px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  #status { font-size: 13px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  #status.ok { color: var(--ok); }
  #status.error { color: var(--error); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 0 24px 24px; height: calc(100vh - 130px); min-height: 420px; }
  .pane { display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
  .pane h2 { margin: 0; min-height: 38px; padding: 6px 8px 6px 14px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .pane h2 button { padding: 2px 10px; font-size: 12px; text-transform: none; letter-spacing: 0; }
  textarea { flex: 1; width: 100%; border: 0; resize: none; padding: 12px 14px; background: transparent; color: var(--text); font: 13px/1.55 var(--mono); tab-size: 4; outline: none; white-space: pre; overflow: auto; }
  #error { display: none; margin: 0; padding: 10px 14px; font: 13px/1.5 var(--mono); color: var(--error); background: var(--accent-soft); border-top: 1px solid var(--line); white-space: pre-wrap; }
  @media (max-width: 760px) {
    header, .controls { padding-left: 16px; padding-right: 16px; }
    main { grid-template-columns: minmax(0, 1fr); height: auto; padding: 0 16px 16px; }
    .pane { height: 55vh; }
    #status { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>ktrs playground</h1>
  <p>Kotlin formatted in your browser, byte-identical to ktfmt 0.65. Nothing leaves this page.
    <a href="https://github.com/Hexay/ktrs">Install ktrs</a></p>
</header>
<div class="controls">
  <label>Style
    <select id="style">
      <option value="0">meta</option>
      <option value="1">google</option>
      <option value="2">kotlinlang</option>
    </select>
  </label>
  <label>Max width <input id="width" type="number" min="20" max="400" placeholder="style"></label>
  <button id="share" type="button">Copy link</button>
  <span id="status" aria-live="polite">Loading the formatter…</span>
</div>
<main>
  <section class="pane">
    <h2>Input</h2>
    <textarea id="input" spellcheck="false" aria-label="Kotlin input"></textarea>
  </section>
  <section class="pane">
    <h2>Formatted <button id="copy" type="button">Copy</button></h2>
    <textarea id="output" spellcheck="false" readonly aria-label="Formatted Kotlin"></textarea>
    <pre id="error"></pre>
  </section>
</main>
<script type="module" src="playground.js"></script>
</body>
</html>
