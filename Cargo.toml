[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Hexay/ktrs"
rust-version = "1.90"

[workspace.dependencies]
# crates.io requires a version on each; keep in step with workspace.package.version.
ktrs-syntax = { path = "crates/ktrs-syntax", version = "0.1.0" }
ktrs-lexer = { path = "crates/ktrs-lexer", version = "0.1.0" }
ktrs-parser = { path = "crates/ktrs-parser", version = "0.1.0" }
ktrs-psi = { path = "crates/ktrs-psi", version = "0.1.0" }
ktrs-fmt = { path = "crates/ktrs-fmt", version = "0.1.0" }
ktrs-cli = { path = "crates/ktrs-cli", version = "0.1.0" }
text-size = "1.1"
expect-test = "1.5"
mimalloc = { version = "0.1", default-features = false }

# The root package only owns the binaries (src/bin), so `cargo install --path .` (and pre-commit's
# rust hooks, which run exactly that) work; the code is in crates/ktrs-cli.
[package]
name = "ktrs"
description = "Fast Kotlin tooling: a ktfmt-identical formatter (`ktrs fmt`, drop-in `ktfmt`)"
readme = "README.md"
keywords = ["kotlin", "formatter", "ktfmt"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
include = ["/src", "/README.md", "/LICENSE-*", "/NOTICE"]

[dependencies]
ktrs-cli.workspace = true
mimalloc.workspace = true

[profile.release]
lto = "fat"
codegen-units = 1
# Unwinding lets the CLI (and fmt-diff) fail only the file whose formatting panicked, as ktfmt
# does on an exception.
panic = "unwind"

# Shipped binaries.
[profile.dist]
inherits = "release"
strip = true
