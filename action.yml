name: ktrs Kotlin formatter and linter
description: Kotlin formatting and linting identical to ktfmt and ktlint, 13-190x faster, no JVM
branding:
  icon: check-square
  color: purple

inputs:
  version:
    description: Release tag to install, e.g. v0.2.0 (default the latest)
    required: false
    default: ""
  check:
    description: >-
      What to run after installing, findings as annotations on the pull request's diff: `fmt` (`ktrs fmt --check`),
      `lint` (`ktrs lint`) or `fmt lint` (default: nothing, install only)
    required: false
    default: ""
  changed-only:
    description: >-
      With `check`: only the Kotlin files changed since `base`. The checkout needs the history back to it
      (actions/checkout `fetch-depth: 0`)
    required: false
    default: "false"
  base:
    description: >-
      The ref `changed-only` compares with (default: the pull request's base commit; on a push the commit before
      it, or the default branch for a new branch or a force push)
    required: false
    default: ""
  fmt-args:
    description: More arguments for `ktrs fmt --check`, e.g. `--style kotlinlang src`
    required: false
    default: ""
  lint-args:
    description: More arguments for `ktrs lint`, e.g. `--ktlint-version 1.8 src`
    required: false
    default: ""
  sarif:
    description: >-
      With `check: lint`: also upload the lint findings to GitHub code scanning (the Security tab and the pull
      request's checks). The job needs `permissions: security-events: write`; private repositories need GitHub
      Code Security. Needs ktrs v0.5.2 or later
    required: false
    default: "false"
  sarif-category:
    description: The code scanning category, to keep separate uploads apart (e.g. one per module)
    required: false
    default: ktrs

runs:
  using: composite
  steps:
    - name: Install ktrs
      shell: bash
      env:
        KTRS_VERSION: ${{ inputs.version }}
        KTRS_INSTALL_DIR: ${{ runner.tool_cache }}/ktrs/bin
        KTRS_ARCH: ${{ runner.arch }}
      run: |
        sh "$GITHUB_ACTION_PATH/install.sh"
        echo "$KTRS_INSTALL_DIR" >> "$GITHUB_PATH"
    - name: Check Kotlin files
      id: check
      if: inputs.check != ''
      shell: bash
      env:
        KTRS_SARIF_FILE: ${{ inputs.sarif == 'true' && format('{0}/ktrs.sarif', runner.temp) || '' }}
        KTRS_INSTALL_DIR: ${{ runner.tool_cache }}/ktrs/bin
        KTRS_CHECK: ${{ inputs.check }}
        KTRS_CHANGED_ONLY: ${{ inputs.changed-only }}
        KTRS_BASE: ${{ inputs.base }}
        KTRS_EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        KTRS_DEFAULT_BASE: origin/${{ github.event.repository.default_branch }}
        KTRS_FMT_ARGS: ${{ inputs.fmt-args }}
        KTRS_LINT_ARGS: ${{ inputs.lint-args }}
      run: sh "$GITHUB_ACTION_PATH/tools/action/check.sh"
    - name: Upload to code scanning
      if: always() && steps.check.outputs.sarif != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.check.outputs.sarif }}
        category: ${{ inputs.sarif-category }}
