# pre-commit pip-installs this repo (pyproject.toml); its launcher downloads the release binaries
# for the pinned rev on first run, so no Rust toolchain is needed.
- id: ktfmt
  name: ktfmt (ktrs)
  description: Format Kotlin exactly like ktfmt 0.64. Pass ktfmt's own flags in `args`.
  entry: ktfmt
  language: python
  files: \.kts?$
  types: [text]

- id: ktrs-fmt
  name: ktrs fmt
  description: Format Kotlin exactly like ktfmt 0.64. Pass e.g. `--style kotlinlang` in `args`.
  entry: ktrs fmt
  language: python
  files: \.kts?$
  types: [text]

- id: ktrs-fmt-check
  name: ktrs fmt --check
  description: Fail if any Kotlin file isn't formatted, without changing it.
  entry: ktrs fmt --check
  language: python
  files: \.kts?$
  types: [text]

- id: ktlint
  name: ktlint (ktrs)
  description: Lint Kotlin like ktlint 2.0 (ported rules; see `ktrs lint --list-rules`). Pass ktlint's own flags in `args`.
  entry: ktlint --relative
  language: python
  files: \.kts?$
  types: [text]

- id: ktrs-lint
  name: ktrs lint
  description: Lint Kotlin like ktlint 2.0 (ported rules), failing on violations.
  entry: ktrs lint
  language: python
  files: \.kts?$
  types: [text]

- id: ktrs-lint-format
  name: ktrs lint --format
  description: Fix what ktlint 2.0's (ported) rules can autocorrect, failing on what remains.
  entry: ktrs lint --format
  language: python
  files: \.kts?$
  types: [text]
