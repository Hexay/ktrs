# pre-commit pip-installs this repo (pyproject.toml); its launcher downloads the release binaries
# for the pinned rev on first run, so no Rust toolchain is needed.
- id: ktfmt
  name: ktfmt (ktrs)
  description: Format Kotlin exactly like ktfmt 0.64. Pass ktfmt's own flags in `args`.
  entry: ktfmt
  language: python
  files: \.kts?$
  types: [text]

- id: ktrs-fmt
  name: ktrs fmt
  description: Format Kotlin exactly like ktfmt 0.64. Pass e.g. `--style kotlinlang` in `args`.
  entry: ktrs fmt
  language: python
  files: \.kts?$
  types: [text]

- id: ktrs-fmt-check
  name: ktrs fmt --check
  description: Fail if any Kotlin file isn't formatted, without changing it.
  entry: ktrs fmt --check
  language: python
  files: \.kts?$
  types: [text]
